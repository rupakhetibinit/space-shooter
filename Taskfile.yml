version: '3'

interval: 100ms

tasks:
  build:
    cmds:
      - odin build . -o:speed
    silent: true

  run:
    deps: [build]
    cmds:
      - space-shooter.exe
    watch: true
    sources:
      - "**/*.odin"
      - assets/campaign.json
    silent: true
  web:
    cmds:
      - powershell -NoProfile -File ./build-web.ps1

  serve-web:
    cmds:
      - python -m http.server 8000 --bind 127.0.0.1 --directory build/web
